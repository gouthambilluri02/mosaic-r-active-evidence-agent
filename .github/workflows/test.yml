name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install "pydantic>=2.10,<3"
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Run scenario benchmark
        run: python scripts/evaluate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test browser agent policy
        run: node --test tests/agent.test.mjs

  deploy-static-space:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: core-agent-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secret
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN is not configured; tests passed and deployment was skipped."
          fi
      - name: Install Hugging Face CLI
        if: steps.token.outputs.available == 'true'
        run: python -m pip install --upgrade "huggingface_hub>=0.30,<2"
      - name: Deploy to Hugging Face Static Space
        if: steps.token.outputs.available == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload gouthambilluri02/mosaic-r-active-evidence-agent .
          --repo-type space
          --exclude ".git/*"
          --exclude "__pycache__/*"
          --exclude "*.pyc"
          --commit-message "Deploy browser-based MOSAIC-R demo"
