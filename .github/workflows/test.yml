name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install "pydantic>=2.10,<3"
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Run scenario benchmark
        run: python scripts/evaluate.py

